<article class="card" [class.saved]="saved()">
  <h3 class="card__title" data-testid="title">{{ article().title | titlecase }}</h3>
  <p class="card__body" data-testid="body">{{ article().body | truncate: 100 }}</p>
  <button
    type="button"
    class="card__button"
    data-testid="toggle"
    (click)="saveToggled.emit(article())"
  >
    {{ saved() ? 'Remove' : 'Save' }}
  </button>
</article>

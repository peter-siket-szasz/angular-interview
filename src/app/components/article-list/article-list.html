@if (articles(); as list) {
  <section class="grid" data-testid="list">
    @for (article of list; track article.id) {
      <app-article-card
        [article]="article"
        [saved]="readingList.isSaved(article.id)"
        (saveToggled)="onSaveToggled($event)"
      />
    }
  </section>

  @if (list.length === 0) {
    <p class="state" data-testid="empty">No articles found.</p>
  }
} @else {
  <p class="state" data-testid="loading">Loading articles…</p>
}
